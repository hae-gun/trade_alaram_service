name: CI

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.backend }}
      frontend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.frontend }}
      docker-compose: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.docker-compose }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed Paths
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'settings.gradle.kts'
            frontend:
              - 'frontend/**'
            docker-compose:
              - 'infra/docker/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cd.yml'

  backend:
    name: Backend Test And Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/settings.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Backend Build
        run: >
          docker run --rm
          -u root
          -e GRADLE_USER_HOME=/home/gradle/.gradle
          -v "${{ github.workspace }}:/workspace"
          -v "$HOME/.gradle:/home/gradle/.gradle"
          -w /workspace
          gradle:8.8-jdk21-alpine
          gradle :backend:build --no-daemon

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Npm Cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Frontend Install
        run: >
          docker run --rm
          -v "${{ github.workspace }}/frontend:/app"
          -v "$HOME/.npm:/root/.npm"
          -w /app
          node:20-alpine
          npm ci

      - name: Frontend Build
        run: >
          docker run --rm
          -v "${{ github.workspace }}/frontend:/app"
          -v "$HOME/.npm:/root/.npm"
          -w /app
          -e NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
          node:20-alpine
          npm run build

  docker-compose:
    name: Docker Compose Config
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docker-compose == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose -f infra/docker/docker-compose.yml config
