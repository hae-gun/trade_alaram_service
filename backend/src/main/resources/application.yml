# 기본 실행 프로필 설정입니다.
# 로컬 개발 중 서버 재시작 후에도 데이터가 남도록 파일 기반 H2 DB와 update DDL 전략을 사용합니다.
spring:
  application:
    name: trade-alarm-backend
  datasource:
    url: jdbc:h2:file:./data/tradealarm;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

app:
  cors:
    allowed-origins:
      - http://localhost:3000
  kis:
    enabled: ${KIS_ENABLED:false}
    base-url: ${KIS_BASE_URL:https://openapivts.koreainvestment.com:29443}
    app-key: ${KIS_APP_KEY:}
    app-secret: ${KIS_APP_SECRET:}
