# Docker Compose 실행 전용 프로필입니다.
# 컨테이너 네트워크에서는 localhost 대신 compose service name(postgres, redis)을 사용합니다.
spring:
  data:
    redis:
      repositories:
        enabled: false
      host: redis
      port: 6379
  datasource:
    url: jdbc:postgresql://postgres:5432/${DB_NAME:tradealarm}?currentSchema=${DB_SCHEMA:tradealarm_app}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:tradealarm_app}
    password: ${DB_PASSWORD:tradealarm_app}
  flyway:
    enabled: true
    create-schemas: true
    default-schema: ${DB_SCHEMA:tradealarm_app}
    schemas:
      - ${DB_SCHEMA:tradealarm_app}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:tradealarm_app}
app:
  kis:
    enabled: ${KIS_ENABLED:false}
    base-url: ${KIS_BASE_URL:https://openapivts.koreainvestment.com:29443}
    app-key: ${KIS_APP_KEY:}
    app-secret: ${KIS_APP_SECRET:}
  kakao:
    auth-base-url: ${KAKAO_AUTH_BASE_URL:https://kauth.kakao.com}
    api-base-url: ${KAKAO_API_BASE_URL:https://kapi.kakao.com}
    rest-api-key: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:}
  slack:
    enabled: ${SLACK_ENABLED:false}
    webhook-url: ${SLACK_WEBHOOK_URL:}
