# local 프로필 설정입니다.
# 로컬 PostgreSQL의 tradealarm_app 스키마를 사용합니다.
spring:
  data:
    redis:
      repositories:
        enabled: false
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:tradealarm}?currentSchema=${DB_SCHEMA:tradealarm_app}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:tradealarm_app}
    password: ${DB_PASSWORD:tradealarm_app}
  flyway:
    enabled: true
    create-schemas: true
    default-schema: ${DB_SCHEMA:tradealarm_app}
    schemas:
      - ${DB_SCHEMA:tradealarm_app}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:tradealarm_app}
app:
  kis:
    enabled: ${KIS_ENABLED:false}
    base-url: ${KIS_BASE_URL:https://openapivts.koreainvestment.com:29443}
    app-key: ${KIS_APP_KEY:}
    app-secret: ${KIS_APP_SECRET:}
  kakao:
    auth-base-url: ${KAKAO_AUTH_BASE_URL:https://kauth.kakao.com}
    api-base-url: ${KAKAO_API_BASE_URL:https://kapi.kakao.com}
    rest-api-key: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:}
  slack:
    enabled: ${SLACK_ENABLED:false}
    webhook-url: ${SLACK_WEBHOOK_URL:}
